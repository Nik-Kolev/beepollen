limit_req_zone $binary_remote_addr zone=beepollen:10m rate=10r/s;

map $remote_addr $remote_addr_anon {
    ~^(?P<net>\d+\.\d+\.\d+)\.\d+$ $net.0;
    ~^(?P<net>[^:]*):: $net::;
    ~^(?P<net>[^:]*:[^:]*): $net::;
    default 0.0.0.0;
}

log_format anonymised '$remote_addr_anon - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name beepollen.bg www.beepollen.bg;
    server_tokens off;
    access_log /var/log/nginx/access.log anonymised;
    return 301 https://beepollen.bg$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.beepollen.bg;
    server_tokens off;
    access_log /var/log/nginx/access.log anonymised;

    ssl_certificate /etc/letsencrypt/live/beepollen.bg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beepollen.bg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://beepollen.bg$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beepollen.bg;
    server_tokens off;
    access_log /var/log/nginx/access.log anonymised;

    ssl_certificate /etc/letsencrypt/live/beepollen.bg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beepollen.bg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        limit_req zone=beepollen burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
