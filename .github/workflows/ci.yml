name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Without strict, an unapproved install script is skipped and the run stays green.
      - run: npm ci --strict-allow-scripts
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
