name: beepollen-prod

x-build-args: &build-args
  NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}

services:
  migrate:
    image: ghcr.io/nik-kolev/beepollen-migrate:${IMAGE_TAG:-latest}
    build:
      context: .
      target: migrate
      args: *build-args
    environment:
      DATABASE_URL: file:/app/data/prod.db
    volumes:
      - db-data:/app/data

  web:
    image: ghcr.io/nik-kolev/beepollen:${IMAGE_TAG:-latest}
    build:
      context: .
      target: runner
      args: *build-args
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/prod.db
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    volumes:
      - db-data:/app/data

volumes:
  db-data:
